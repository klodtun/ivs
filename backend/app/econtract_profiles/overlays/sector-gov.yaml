# Overlay ชั้นที่ 2 — ภาครัฐ
#
# ที่มา: คู่มือ ETDA §3.2 "ความแตกต่างในการจัดทำ e-Contract ระหว่างภาครัฐกับภาคเอกชน"
#   ภาครัฐ "เน้นความรัดกุมและความน่าเชื่อถือสูง จึงมักถูกกำหนดให้ใช้ลายมือชื่ออิเล็กทรอนิกส์
#   แบบเชื่อถือได้ เช่น Digital Signature ควบคู่กับการมีใบรับรอง (Certificate)"
#   และ "การทำสัญญาจะต้องอิงกับระเบียบภายในและกฎหมายอื่นอย่างเคร่งครัด เช่น ระเบียบสำนัก
#   นายกรัฐมนตรีว่าด้วยงานสารบรรณ (ระบบ e-Saraban)"
#
# overlay ยกระดับความเข้มได้เท่านั้น — ลดต่ำกว่า baseline ไม่ได้ (monotonic hardening)

schema_version: 1
scope: sector
scope_ref: gov
name_th: ภาครัฐ

applies_to: "*"

steps:
  e_signature:
    min_assurance: reliable_ca
    note_th: "ภาครัฐมักถูกกำหนดให้ใช้ Digital Signature ที่มีใบรับรองจาก CA"

  e_retention:
    must_store: [+e_saraban_ref]
    access_control: restricted
    note_th: "ต้องอ้างอิงเลขที่หนังสือในระบบสารบรรณอิเล็กทรอนิกส์"

  e_seal:
    hint_th: "เจ้าหน้าที่รัฐลงนามในฐานะผู้มีอำนาจตามตำแหน่ง จึงอาจไม่จำเป็นต้องประทับตรานิติบุคคล — แต่ต้องตรวจระเบียบที่บังคับใช้"
